services:
  postgres:
    image: postgres:16
    container_name: kognivera-local-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kognivera
    ports:
      - "5433:5432"
    volumes:
      - kognivera_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  kognivera_pgdata: